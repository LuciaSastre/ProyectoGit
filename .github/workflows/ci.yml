name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Añadir feature al README
        run: |
          echo "Añadida feature: ${{ github.head_ref || github.ref_name }}" >> README.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Actualizar README con nueva feature" || echo "No hay cambios"
          git push

  validate-dev:
    runs-on: self-hosted
    needs: update-readme

    steps:
      - name: Validar DEV_TOKEN
        shell: bash
        run: |
          if [ "$LOCAL_DEV_TOKEN" = "${{ secrets.DEV_TOKEN }}" ]; then
            echo "DEV_TOKEN válido"
          else
            echo "DEV_TOKEN no coincide"
            exit 1
          fi